name: Audio decode and FFmpeg resources
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: win32-x64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      EXPECTED_AUDIO_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Assert native runner architecture
        run: node -e "require('assert').equal(process.platform+'-'+process.arch, process.env.EXPECTED_AUDIO_TARGET)"
      # Audio tests use Node built-ins and run without Electron/native DLL setup.
      - run: npm run ffmpeg:prepare
      - run: npm run ffmpeg:verify
      - run: npm run test:audio
      - run: npm run test:audio:integration
      - run: npm run ffmpeg:smoke-pack
