name: Release installers
on:
  push:
    tags: ['v*']
    branches: ['codex/multiplatform-release']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-lifecycle
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: win32-x64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      EXPECTED_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: node -e "require('assert').equal(process.platform+'-'+process.arch, process.env.EXPECTED_TARGET)"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfuse2 xvfb
      - run: npm ci
      - run: npm run release:verify
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          RELEASE_MASTER: refs/remotes/origin/master
      - run: npm run test:release
      - run: npm run native:test
      - if: runner.os == 'Windows'
        run: npm run native:compare
      - run: npm run test:audio
      - run: npm run test:audio:integration
      - run: npm run electron:build
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: runner.os == 'Windows'
        with:
          ref: a7f938151321cc7346512e8aab30c9993c931d54
          path: .cache/upgrade-baseline
      - name: Build original 1.1.4 upgrade baseline
        if: runner.os == 'Windows'
        working-directory: .cache/upgrade-baseline
        run: npm ci && npm run electron:build -- --publish never
      - if: runner.os != 'Linux'
        run: npm run test:app && npm run test:installers
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:app && xvfb-run -a npm run test:installers
      - run: node scripts/release/artifacts.cjs record
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installers-${{ matrix.target }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-diagnostics-${{ matrix.target }}
          path: |
            artifacts/app-smoke/**/result.json
            artifacts/app-smoke/**/main-window.png
            artifacts/installer-smoke/result.json
            native/build/Testing/Temporary/*.log
            dist/builder-debug.yml
          retention-days: 7
  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: installers-*
          path: collected
          merge-multiple: true
      - run: node scripts/release/artifacts.cjs aggregate collected release-assets
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: node scripts/release/github.cjs draft "$RELEASE_TAG" release-assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
      - if: github.event_name == 'workflow_dispatch' || !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-dry-run
          path: release-assets/*
          retention-days: 7
