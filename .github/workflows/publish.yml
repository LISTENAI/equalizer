name: Publish accepted release
on:
  push:
    branches: [master]
    paths: ['releases/acceptance/v*.json']
permissions:
  contents: read
concurrency:
  group: publish-accepted-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Publish only newly accepted exact artifacts
        run: node scripts/release/publish-accepted.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
